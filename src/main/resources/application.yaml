server:
  port: 8080

spring:
  application:
    name: gym-manager
  datasource:
    url: jdbc:postgresql://localhost:5432/gym_manager
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:cambia-este-valor-por-un-secreto-largo-y-seguro}
    expiration-ms: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.raulmartin.gym_manager: DEBUG
    org.hibernate.SQL: DEBUG